[package]
name = "sheaf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sheaf on the command line: the same operations as the app, with no GUI"

[[bin]]
name = "sheaf-cli"
path = "src/bin/sheaf-cli.rs"

[dependencies]
sheaf-ops.workspace = true
sheaf-progress.workspace = true
sheaf-doc.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
ctrlc = "3"

[dev-dependencies]
lopdf.workspace = true
