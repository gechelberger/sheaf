[package]
name = "sheaf-image"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Image in, image out: scan cleanup, blank pages and other pixel work for sheaf, with no PDFs"

[dependencies]
sheaf-progress.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
image = { workspace = true, features = ["jpeg", "tiff", "bmp", "webp"] }
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }

[dev-dependencies]
serde_json.workspace = true
