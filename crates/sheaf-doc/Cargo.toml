[package]
name = "sheaf-doc"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Forms built in code and the lookup for Greg's corpus of real ones
# (`forms::fixture`, `forms::corpus`), for other crates' tests.
fixtures = []

[dependencies]
# Random mark ids, so copies of a file never hand out the same one.
fastrand = "2"
sheaf-core.workspace = true
lopdf.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
im.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# Image pages: decoding and G4 come from sheaf-image; Flate is ours.
sheaf-image.workspace = true
flate2 = "1"
# Stamps from images keep their transparency (a soft mask).
image.workspace = true
# XFDF, comments as XML (M9 slice 18).
quick-xml = "0.41"

[dev-dependencies]
image.workspace = true
env_logger.workspace = true
