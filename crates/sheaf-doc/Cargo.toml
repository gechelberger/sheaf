[package]
name = "sheaf-doc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Random mark ids, so copies of a file never hand out the same one.
fastrand = "2"
sheaf-core.workspace = true
lopdf.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
im.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
# Image pages: decoding and G4 come from sheaf-image; Flate is ours.
sheaf-image.workspace = true
flate2 = "1"
# Stamps from images keep their transparency (a soft mask).
image.workspace = true

[dev-dependencies]
image.workspace = true
env_logger.workspace = true
