[package]
name = "sheaf-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sheaf's document operations without a GUI: what both the app and the command line run"

[dependencies]
sheaf-core.workspace = true
sheaf-doc.workspace = true
sheaf-render.workspace = true
in-progress.workspace = true
sheaf-image.workspace = true
# OCR for scans. Engines are cargo features of sheaf-ocr, picked by the
# binary (sheaf-app, sheaf-cli); without one it builds and says so.
sheaf-ocr.workspace = true
anyhow.workspace = true
log.workspace = true
# Stamp collections are PDFs; favorites are JSON.
lopdf.workspace = true
serde_json.workspace = true
regex.workspace = true
serde.workspace = true
toml = "0.9"
image = { workspace = true, features = ["jpeg"] }

[dev-dependencies]
fastrand = "2"
sheaf-doc = { workspace = true, features = ["fixtures"] }
