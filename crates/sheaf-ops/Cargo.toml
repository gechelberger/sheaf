[package]
name = "sheaf-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sheaf's document operations without a GUI: what both the app and the command line run"

[dependencies]
sheaf-core.workspace = true
sheaf-doc.workspace = true
sheaf-render.workspace = true
sheaf-progress.workspace = true
anyhow.workspace = true
log.workspace = true
image = { workspace = true, features = ["jpeg"] }
