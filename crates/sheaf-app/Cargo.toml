[package]
name = "sheaf-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sheaf"
path = "src/main.rs"

[dependencies]
sheaf-core.workspace = true
sheaf-render.workspace = true
sheaf-doc.workspace = true
sheaf-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
image.workspace = true
smallvec.workspace = true
futures.workspace = true
im.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# examples/gen_icons.rs only; both are already in the tree via GPUI.
resvg = { version = "0.46", default-features = false }
image = { workspace = true, features = ["ico"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
