[package]
name = "sheaf-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sheaf"
path = "src/main.rs"

[features]
# Both OCR engines are in by default. `cargo build --no-default-features`
# skips them for a quick build that needs no CMake, C++ or network.
default = ["ocr-tesseract", "ocr-oar", "plugins"]
ocr-tesseract = ["sheaf-ocr/tesseract"]
ocr-oar = ["sheaf-ocr/oar"]
# WebAssembly plugins (wasmtime). Off for a quicker dev build.
plugins = ["dep:sheaf-plugin", "dep:semver"]

[dependencies]
sheaf-core.workspace = true
sheaf-render.workspace = true
sheaf-doc.workspace = true
sheaf-ui.workspace = true
sheaf-ocr.workspace = true
sheaf-plugin = { workspace = true, optional = true }
semver = { version = "1", features = ["serde"], optional = true }
gpui.workspace = true
gpui_platform.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
image.workspace = true
smallvec.workspace = true
futures.workspace = true
im.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# examples/gen_icons.rs only; both are already in the tree via GPUI.
resvg = { version = "0.46", default-features = false }
image = { workspace = true, features = ["ico"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
