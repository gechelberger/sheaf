name: Release

# Tag v<version> (matching Cargo.toml's version, e.g. v0.1.0-alpha.1) to
# build bundles for Linux and Windows and attach them to a GitHub release.
# Tags with a pre-release suffix (anything after a `-`) are marked as
# pre-releases.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          }

      - name: Linux system deps (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake pkg-config \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libvulkan1 libasound2-dev libglib2.0-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Cache Tesseract build
        uses: actions/cache@v4
        with:
          path: |
            ~/.tesseract-rs
            ~/AppData/Roaming/tesseract-rs
          key: tesseract-rs-0.4.0-${{ runner.os }}

      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh

      - name: Fetch OCR data
        shell: bash
        run: scripts/fetch-ocr-data.sh

      - name: Package
        shell: bash
        run: scripts/package.sh

      - name: Upload bundle
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sheaf-*.tar.gz,dist/sheaf-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
