name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Linux system deps (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake pkg-config \
            libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libvulkan1 libasound2-dev libglib2.0-dev libssl-dev libzstd-dev

      # rust-toolchain.toml pins the channel; rustup picks it up.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Plugin fixtures and examples are WASI components. Installed for the
      # pinned toolchain, which this runs under inside the checkout.
      - name: WASI target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2

      # tesseract-rs builds Tesseract and Leptonica from source into this
      # directory; keep it between runs.
      - name: Cache Tesseract build
        uses: actions/cache@v4
        with:
          path: |
            ~/.tesseract-rs
            ~/AppData/Roaming/tesseract-rs
            ~/Library/Application Support/tesseract-rs
          key: tesseract-rs-0.4.0-${{ runner.os }}

      - name: Fetch PDFium
        shell: bash
        run: scripts/fetch-pdfium.sh

      - name: Fetch OCR data
        shell: bash
        run: scripts/fetch-ocr-data.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: sheaf-image stays pixels only
        shell: bash
        # No PDFs, OCR or windows under it (see crates/sheaf-image/src/lib.rs).
        run: |
          bad=$(cargo tree -p sheaf-image -e normal --prefix none | awk '{print $1}' | sort -u \
            | grep -E '^(lopdf|pdfium-render|gpui|tesseract|oar-ocr|ort|sheaf-(doc|render|ocr|ops|ui|app|plugin|print))$' || true)
          if [ -n "$bad" ]; then echo "sheaf-image depends on: $bad"; exit 1; fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: OCR engine smoke tests
        run: cargo test -p sheaf-ocr --features tesseract,oar -- --ignored

      # Bundled plugins and the host test fixture build in their own
      # workspaces for wasm32-wasip2; check them like the rest.
      - name: Plugins (fmt, clippy, unit tests, staged build)
        shell: bash
        run: |
          for dir in plugins/*/ crates/sheaf-plugin/tests/fixtures/test-plugin/; do
            (cd "$dir" && cargo fmt -- --check \
              && cargo clippy --target wasm32-wasip2 -- -D warnings)
          done
          for dir in plugins/*/; do (cd "$dir" && cargo test); done
          scripts/build-plugins.sh

      - name: Check without OCR engines or plugins
        run: cargo check -p sheaf-app --no-default-features

      - name: Build
        run: cargo build -p sheaf-app

      # Tesseract and Leptonica must be linked statically: a packaged build
      # has no libc++ or Tesseract to find at runtime. ONNX Runtime must not
      # be a link-time dependency either; it is loaded from ocr/lib on demand.
      - name: No dynamic engine libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd target/debug/sheaf
          ! ldd target/debug/sheaf | grep -E 'libc\+\+|libunwind|onnxruntime|tesseract|leptonica'

      # The same for macOS, where libc++ and the frameworks ship with the
      # system: anything outside /usr/lib and /System is missing from a
      # packaged build.
      - name: Only system libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L target/debug/sheaf
          bad=$(otool -L target/debug/sheaf | tail -n +2 | awk '{print $1}' \
            | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          if [ -n "$bad" ]; then echo "sheaf links: $bad"; exit 1; fi

      # ONNX Runtime is loaded on demand (the ort crate's static binaries
      # are x86-64-v3 and crashed here before main); keep it that way.
      - name: Starts on a CPU without AVX2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y qemu-user
          qemu-x86_64 -cpu Nehalem target/debug/sheaf --version
