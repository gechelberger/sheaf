id = "bookmark-from-pattern"
name = "Bookmark from Pattern"
version = "0.2.1"
api = "^0.3"
homepage = "https://github.com/sheaf-pdf/sheaf/tree/main/plugins/bookmark-from-pattern"
description = "Bookmarks every match of a pattern, at the match, titled from it: invoice numbers, account numbers, check numbers, anything a regular expression can find."

[[commands]]
id = "bookmark"
label = "Bookmarks from &Pattern…"
icon = "icons/bookmark.svg"
help = "Bookmark every match of a regular expression, titled from the match."
keywords = ["regex", "outline", "invoice"]
when = ["document"]
category = "Bookmarks"
menu = "Document"
