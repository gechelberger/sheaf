id = "currency-convert"
name = "Currency Convert"
version = "0.2.0"
api = "^0.2"
homepage = "https://github.com/gechelberger/sheaf/tree/main/plugins/currency-convert"
description = "Finds foreign-currency amounts (€1.234,56, GBP 980.00, 1 200 CHF, …) and notes each one's value in your chosen currency at the ECB rate for a date you pick."

[[commands]]
id = "convert"
label = "Convert &Currency…"
icon = "icons/convert.svg"
help = "Find foreign-currency amounts and note each one's value in your currency at the ECB rate for a date you pick."
keywords = ["exchange rate", "fx", "ecb", "euro"]
category = "Workpapers"
menu = "Tools"

[permissions]
network = ["api.frankfurter.dev"]
