[package]
name = "currency-convert"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sheaf-plugin-api = { path = "../../crates/sheaf-plugin-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Built on its own for wasm32-wasip2, outside the sheaf workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
regex = "1"
