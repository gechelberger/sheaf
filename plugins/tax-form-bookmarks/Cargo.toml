[package]
name = "tax-form-bookmarks"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sheaf-plugin-api = { path = "../../crates/sheaf-plugin-api" }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

# Built on its own for wasm32-wasip2, outside the sheaf workspace.
[workspace]

[profile.release]
opt-level = "s"
lto = true
strip = true
